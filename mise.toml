# Build policy is shared by build, test, run and their dependencies.
[env]
ARC_BUILD_CONFIG = "1"
CC = "{% if env.CC is defined and env.CC != '' %}{{ env.CC }}{% elif os() == 'macos' %}clang{% else %}gcc{% endif %}"
AR = "{{ env.AR | default(value='ar') }}"
ARC_PLATFORM = "{% if os() == 'windows' %}windows{% else %}unix{% endif %}"
ARC_EXE_SUFFIX = "{% if os() == 'windows' %}.exe{% endif %}"
ARC_CFLAGS = "-std=c11 -D_FILE_OFFSET_BITS=64 -Wall -Wextra -Wpedantic -Werror"
ARC_LDFLAGS = "{% if os() == 'windows' %}-municode{% endif %}"
ARC_SANITIZER_FLAGS = "{% if env.ARC_SANITIZE | default(value='0') == '1' %}-fsanitize=address,undefined -fno-omit-frame-pointer -g{% endif %}"
FILEKIT_SANITIZER_FLAGS = "{% if env.ARC_SANITIZE | default(value=env.FILEKIT_SANITIZE | default(value='0')) == '1' %}-fsanitize=address,undefined -fno-omit-frame-pointer -g{% endif %}"
PKG_CONFIG_PATH = "{% if os() == 'macos' %}{{ exec(command='brew --prefix libarchive') }}/lib/pkgconfig{% if env.PKG_CONFIG_PATH is defined and env.PKG_CONFIG_PATH != '' %}:{{ env.PKG_CONFIG_PATH }}{% endif %}{% else %}{{ env.PKG_CONFIG_PATH | default(value='') }}{% endif %}"

[tools]
python = "3.13.15"
uv = "0.12.24"

[tasks.build]
description = "Build arc outside the source tree"
shell = "bash -euo pipefail -c"
run = "bash scripts/build.sh"
dir = "{{config_root}}"

[tasks.test]
description = "Build arc, then run isolated black-box CLI tests"
depends = ["build"]
shell = "bash -euo pipefail -c"
run = "bash scripts/test.sh"
dir = "{{config_root}}"

[tasks.verify]
description = "Alias for the black-box test suite"
depends = ["test"]

[tasks.test-release]
description = "Test the already-built static release binary and public API"
shell = "bash -euo pipefail -c"
run = "bash scripts/test-release.sh"
dir = "{{config_root}}"

[tasks.check]
description = "Build and test arc, then check C formatting"
depends = ["test"]
shell = "bash -euo pipefail -c"
run = "bash scripts/format.sh --check"
dir = "{{config_root}}"

[tasks.format]
description = "Format C sources"
shell = "bash -euo pipefail -c"
run = "bash scripts/format.sh"
dir = "{{config_root}}"

[tasks."format-check"]
description = "Check C formatting"
shell = "bash -euo pipefail -c"
run = "bash scripts/format.sh --check"
dir = "{{config_root}}"

[tasks.run]
description = "Build and run arc with forwarded arguments"
depends = ["build"]
shell = "bash -euo pipefail -c"
run = "bash scripts/run.sh"
dir = "{{config_root}}"

[tasks."filekit:build"]
description = "Build filekit independently"
shell = "bash -euo pipefail -c"
run = "bash filekit/build.sh"
dir = "{{config_root}}"

[tasks."filekit:verify"]
description = "Run filekit's independent API and build checks"
depends = ["filekit:build"]
shell = "bash -euo pipefail -c"
run = "python filekit/verify.py"
dir = "{{config_root}}"
