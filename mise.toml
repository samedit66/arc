# Use the platform toolchain; explicit CC/CXX always take precedence.
[env]
CC = "{% if env.CC is defined and env.CC != '' %}{{ env.CC }}{% elif os() == 'macos' %}clang{% else %}gcc{% endif %}"
CXX = "{% if env.CXX is defined and env.CXX != '' %}{{ env.CXX }}{% elif os() == 'macos' %}clang++{% else %}g++{% endif %}"

[settings]
pipx.uvx = true

[tools]
cmake = "4.4.4"
ninja = "1.13.2"
"pipx:clang-format" = "22.1.8"
python = "3.13.15"
uv = "0.12.24"

[tasks.configure]
description = "Configure CMake dev (or ARC_CMAKE_PRESET) when needed"
shell = "bash -euo pipefail -c"
run = "bash scripts/configure.sh"
dir = "{{config_root}}"

[tasks.build]
description = "Incrementally build the CMake dev configuration"
depends = ["configure"]
shell = "bash -euo pipefail -c"
run = "bash scripts/build.sh"
dir = "{{config_root}}"

[tasks.test]
description = "Build arc, then run isolated black-box CLI tests"
depends = ["build"]
shell = "bash -euo pipefail -c"
run = "bash scripts/test.sh"
dir = "{{config_root}}"

[tasks.verify]
description = "Alias for the black-box test suite"
depends = ["test"]

[tasks.test-release]
description = "Test the already-built static release binary and public API"
shell = "bash -euo pipefail -c"
run = "bash scripts/test-release.sh"
dir = "{{config_root}}"

[tasks.check]
description = "Build and test arc, then check C formatting"
depends = ["test", "consumers"]
shell = "bash -euo pipefail -c"
run = "bash scripts/format.sh --check"
dir = "{{config_root}}"

[tasks.format]
description = "Format C sources"
shell = "bash -euo pipefail -c"
run = "bash scripts/format.sh"
dir = "{{config_root}}"

[tasks."format-check"]
description = "Check C formatting"
shell = "bash -euo pipefail -c"
run = "bash scripts/format.sh --check"
dir = "{{config_root}}"

[tasks.run]
description = "Build and run arc with forwarded arguments"
depends = ["build"]
shell = "bash -euo pipefail -c"
run = "bash scripts/run.sh"
dir = "{{config_root}}"

[tasks.consumers]
description = "Check source, installed CMake and pkg-config consumers"
shell = "bash -euo pipefail -c"
run = "bash scripts/check-consumers.sh"
dir = "{{config_root}}"

[tasks.release]
description = "Build Release with pinned vcpkg dependencies for the host"
shell = "bash -euo pipefail -c"
run = "bash scripts/build-release.sh"
dir = "{{config_root}}"

[tasks.dist]
description = "Test and package the host release"
depends = ["release"]
shell = "bash -euo pipefail -c"
run = "bash scripts/test-release.sh && bash scripts/package-release.sh"
dir = "{{config_root}}"
