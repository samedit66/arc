name: Archive checks

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tag:
    name: Validate release tag
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: bash scripts/check-release-tag.sh "$RELEASE_TAG" "$RELEASE_COMMIT"

  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: bash
          - os: windows-latest
            shell: msys2 {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang libarchive-dev pkg-config python3 cmake g++
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install libarchive pkgconf llvm cmake
          printf '%s/bin\n' "$(brew --prefix llvm)" >> "$GITHUB_PATH"
      - name: Install Windows UCRT64 dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Select MSYS2 Bash for mise tasks
        if: runner.os == 'Windows'
        run: printf 'MISE_BASH_PATH=%s\n' "$(cygpath -m /usr/bin/bash)" >> "$GITHUB_ENV"
      - name: Install mise and pinned Python/uv
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
      - name: Formatting (canonical macOS LLVM toolchain)
        if: runner.os == 'macOS'
        run: mise run format-check
      - name: Build and regression checks
        run: mise run test
      - name: External C and C++ consumers
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then export CMAKE_GENERATOR=Ninja; fi
          mise exec -- bash scripts/check-consumers.sh
      - name: Independent filekit checks
        run: mise run filekit:verify
      - name: Address and undefined-behavior sanitizers
        if: runner.os != 'Windows'
        env:
          CC: clang
          ARC_SANITIZE: '1'
          ARC_BUILD_DIR: ${{ runner.temp }}/arc-sanitize
        run: mise run test

  release:
    name: Publish GitHub Release
    needs: [release-tag, check]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Publish checked tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          bash scripts/check-release-tag.sh "$RELEASE_TAG" "$RELEASE_COMMIT"
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main" "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          bash scripts/check-release-tag.sh "$RELEASE_TAG" "$RELEASE_COMMIT"
          if state=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv'); then
            if [[ "$state" != $'false\tfalse' ]]; then
              echo 'An existing release is a draft or prerelease; refusing to change it.' >&2
              exit 1
            fi
            echo "Release $RELEASE_TAG is already published."
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
