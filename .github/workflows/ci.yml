name: Archive checks

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tag:
    name: Validate release tag
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: bash scripts/check-release-tag.sh "$RELEASE_TAG" "$RELEASE_COMMIT"

  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: bash
          - os: windows-latest
            shell: msys2 {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang libarchive-dev pkg-config g++
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install libarchive pkgconf
      - name: Install Windows UCRT64 dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Select MSYS2 Bash for mise tasks
        if: runner.os == 'Windows'
        run: printf 'MISE_BASH_PATH=%s\n' "$(cygpath -m /usr/bin/bash)" >> "$GITHUB_ENV"
      - name: Install mise and pinned development tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
      - name: Build, tests, formatting and consumer checks
        run: mise run check
      - name: Address and undefined-behavior sanitizers
        if: runner.os != 'Windows'
        env:
          CC: clang
          ARC_SANITIZE: '1'
          ARC_BUILD_DIR: ${{ runner.temp }}/arc-sanitize
        run: mise run test

  binaries:
    name: Binary ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            shell: bash
          - os: ubuntu-24.04-arm
            target: linux-arm64
            shell: bash
          - os: macos-15-intel
            target: macos-x86_64
            shell: bash
          - os: macos-15
            target: macos-arm64
            shell: bash
          - os: windows-latest
            target: windows-x86_64
            shell: msys2 {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install Linux binary build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential musl-tools linux-libc-dev pkg-config curl zip unzip autoconf automake libtool
      - name: Install macOS binary build tools
        if: runner.os == 'macOS'
        run: brew install pkgconf autoconf automake libtool
      - name: Install Windows binary build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            git zip unzip autoconf automake libtool make perl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Select Windows Bash
        if: runner.os == 'Windows'
        run: printf 'MISE_BASH_PATH=%s\n' "$(cygpath -m /usr/bin/bash)" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          # Actions caches are immutable. Restore the latest snapshot, then save
          # newly built ABI variants even when dependencies have not changed.
          key: static-v2-${{ matrix.target }}-${{ hashFiles('release/vcpkg.json', 'release/triplets/**', 'mise.toml', 'scripts/build-release.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            static-v2-${{ matrix.target }}-${{ hashFiles('release/vcpkg.json', 'release/triplets/**', 'mise.toml', 'scripts/build-release.sh') }}-
      - name: Prepare binary cache
        run: |
          release_temp=$RUNNER_TEMP
          if command -v cygpath >/dev/null 2>&1; then release_temp=$(cygpath -m "$RUNNER_TEMP"); fi
          mkdir -p "$release_temp/vcpkg-cache"
          printf 'ARC_RELEASE_BUILD_DIR=%s/arc-release\nVCPKG_DEFAULT_BINARY_CACHE=%s/vcpkg-cache\n' "$release_temp" "$release_temp" >> "$GITHUB_ENV"
      - name: Build, inspect, test and package native release
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: mise run dist
      - name: Save failed binary build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/arc-release/vcpkg/buildtrees/libarchive/**/*.log
            ${{ runner.temp }}/arc-release/vcpkg/buildtrees/libarchive/**/CMakeConfigureLog.yaml
            ${{ runner.temp }}/arc-release/vcpkg/buildtrees/libarchive/**/CMakeCache.txt
            ${{ runner.temp }}/arc-release/vcpkg/buildtrees/libarchive/**/config.h
            ${{ runner.temp }}/arc-release/arc/CMakeCache.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ runner.temp }}/arc-release/assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [release-tag, check, binaries]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: release-assets
      - name: Publish checked tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          bash scripts/check-release-tag.sh "$RELEASE_TAG" "$RELEASE_COMMIT"
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main" "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          bash scripts/check-release-tag.sh "$RELEASE_TAG" "$RELEASE_COMMIT"
          cd release-assets
          sha256sum arc-*.tar.gz arc-*.zip > SHA256SUMS
          marker="<!-- arc-release:$RELEASE_COMMIT -->"
          if state=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv'); then
            if [[ "$state" == $'false\tfalse' ]]; then
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
            body=$(gh release view "$RELEASE_TAG" --json body --jq .body)
            if [[ "$state" != $'true\tfalse' || "$body" != *"$marker"* ]]; then
              echo 'Existing draft or prerelease was not created by this workflow.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" arc-*.tar.gz arc-*.zip SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" arc-*.tar.gz arc-*.zip SHA256SUMS --draft --verify-tag --generate-notes --notes "$marker" --title "$RELEASE_TAG"
          fi
          gh release edit "$RELEASE_TAG" --draft=false
