name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOBO_TAG: gobo-26.06
  EIFFELSTUDIO_VERSION: '25.12'
  EIFFELSTUDIO_REVISION: '98922'
  PYTHONUTF8: '1'

jobs:
  test:
    name: ${{ matrix.compiler }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2022]
        compiler: [ge, ise]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Enable Windows symlinks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null
      # Reuse installers from the pinned progress_bar submodule.
      - name: Install Gobo
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash vendor/progress_bar/.github/scripts/install-gobo.sh
      - name: Install Gobo on Windows
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: vendor/progress_bar/.github/scripts/install-gobo.ps1
      - name: Install EiffelStudio on Ubuntu
        if: matrix.compiler == 'ise' && runner.os == 'Linux'
        run: bash vendor/progress_bar/.github/scripts/install-eiffelstudio.sh
      - name: Install EiffelStudio on macOS
        if: matrix.compiler == 'ise' && runner.os == 'macOS'
        run: |
          brew install gtk+3
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          platform=macosx-x86-64
          archive="Eiffel_${EIFFELSTUDIO_VERSION}_rev_${EIFFELSTUDIO_REVISION}-${platform}.tar.bz2"
          curl -fsSL "https://www.eiffel.com/cdn/EiffelStudio/${EIFFELSTUDIO_VERSION}/${EIFFELSTUDIO_REVISION}/$archive" -o "$RUNNER_TEMP/$archive"
          tar -xjf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          root="$RUNNER_TEMP/Eiffel_${EIFFELSTUDIO_VERSION}"
          echo "ISE_EIFFEL=$root" >> "$GITHUB_ENV"
          echo "ISE_LIBRARY=$root" >> "$GITHUB_ENV"
          echo "ISE_PLATFORM=$platform" >> "$GITHUB_ENV"
          echo "$root/studio/spec/$platform/bin" >> "$GITHUB_PATH"
      - name: Install EiffelStudio on Windows
        if: matrix.compiler == 'ise' && runner.os == 'Windows'
        shell: pwsh
        run: vendor/progress_bar/.github/scripts/install-eiffelstudio.ps1
      - name: Install independent archive reader
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Install Conan
        run: python -m pip install conan==2.33.0
      - name: Report compiler versions
        shell: bash
        run: |
          gec --version
          if [ '${{ matrix.compiler }}' = ise ]; then ec -version; fi
      - name: Packaging contracts
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Cache Conan dependencies
        uses: actions/cache@v4
        with:
          path: build/conan
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conan.lock', 'conanfile.py', 'scripts/native_ecf.py') }}
      - name: Prepare native dependencies
        run: python scripts/prepare.py
      - name: Compile and run all tests
        run: python tests/check_archive.py --build --compiler ${{ matrix.compiler }}
      - name: Check whitespace
        run: git diff --check
      - name: Retain build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/native/manifest.json
            build/ci/**/EIFGENs/**/Makefile*
            build/ci/**/EIFGENs/**/*.log
            .gobo/*.sh
          if-no-files-found: ignore
